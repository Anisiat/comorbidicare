site_name: comorbidicare Documentation
site_description: Documentation and guides for deriving comorbidity features from iCARE data
site_url: https://anisiat.github.io/comorbidicare/

dev_addr: '0.0.0.0:8000'

theme:
  name: material
  logo: assets/logo-icon.svg
  favicon: assets/logo-icon.svg
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Guides:
      - Prepare iCARE tables: how-to/prepare-icare-tables.md
      - Rename columns: how-to/rename-columns.md
      - Run the steps separately: how-to/run-steps-separately.md
  - Background:
      - Mapping methodology: explanation/methodology.md
      - Pipeline and cutoff: explanation/pipeline-and-cutoff.md
  - Reference:
      - Overview: api/index.md
      - Input schema and pipeline: api/schema.md
      - Cleaning: api/cleaning.md
      - Mapping: api/mapping.md
      - Features: api/features.md

plugins:
  - search
  # Old page addresses still work, e.g. links in the 0.1.0 README on PyPI.
  - redirects:
      redirect_maps:
        00-getting-started.md: getting-started.md
        01-CCI-mapping-methodology.md: explanation/methodology.md
        02-icare-source-tables-extraction.md: how-to/prepare-icare-tables.md
        03-module-information.md: explanation/pipeline-and-cutoff.md
        04-feature-pipeline.md: explanation/pipeline-and-cutoff.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      # Render ```mermaid code blocks as diagrams.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/api-custom.css
