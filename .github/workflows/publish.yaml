name: Publish to PyPI

# Runs when you publish a GitHub Release (e.g. tag v0.1.0).
on:
  release:
    types: [published]

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build twine

      # Stops a release tagged v0.1.0 from uploading a different version.
      - name: Check the tag matches the version in pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml version: $VERSION, release tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Check the release files
        run: python -m twine check dist/*

      - name: Store the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name in the PyPI trusted publisher settings.
    environment:
      name: pypi
      url: https://pypi.org/project/comorbidicare/
    permissions:
      id-token: write  # lets GitHub prove to PyPI who is uploading; no token needed
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
