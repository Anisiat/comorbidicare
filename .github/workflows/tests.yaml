name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Run the tests once per combination below (3 jobs).
    # Oldest and newest supported versions; pandas 2.3 matches the SDE.
    # pandas 3 needs Python 3.11+, so that one pairing is skipped.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        pandas-version: ["2.3.*", "3.*"]
        exclude:
          - python-version: "3.10"
            pandas-version: "3.*"

    name: test (Python ${{ matrix.python-version }}, pandas ${{ matrix.pandas-version }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e . pytest "pandas==${{ matrix.pandas-version }}"
      - run: python -c "import sys, pandas; print('Python', sys.version.split()[0], '| pandas', pandas.__version__)"
      - run: python -m pytest
