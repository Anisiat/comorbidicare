[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comorbidicare"
version = "0.1.0rc1"
description = "Derive the 17 Charlson comorbidities and the Charlson Comorbidity Index (CCI) from iCARE diagnoses, problems and prescribing tables"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Anisia Talianu", email = "anisia.talianu@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]

dependencies = [
    "pandas>=2.3",
    "numpy>=1.23",
]

[project.urls]
Documentation = "https://anisiat.github.io/comorbidicare/"
Source = "https://github.com/Anisiat/comorbidicare"
Issues = "https://github.com/Anisiat/comorbidicare/issues"
Changelog = "https://github.com/Anisiat/comorbidicare/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "build", "twine"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comorbidicare = ["data/*.csv"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
